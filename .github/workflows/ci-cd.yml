name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---------------------------------------------------------------------------
  # ЗАДАЧА 1: Статический анализ
  # ---------------------------------------------------------------------------
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run C static analysis
        run: make -C arlloc-rs/c-src cppchk

      - name: Run Rust static analysis
        run: |
          cd arlloc-rs
          cargo fmt --check
          cargo clippy -- -D warnings

  # ---------------------------------------------------------------------------
  # ЗАДАЧА 2: Сборка и тестирование (Ubuntu + macOS)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install C dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust crate
        run: |
          cd arlloc-rs
          cargo build --release

      - name: Run C tests
        run: make -C arlloc-rs/c-src test

      - name: Run Rust tests
        run: |
          cd arlloc-rs
          cargo test

  # ---------------------------------------------------------------------------
  # ЗАДАЧА 3: Проверка компиляции бенчмарков
  # ---------------------------------------------------------------------------
  bench-compile:
    name: Benchmark Compilation Check
    runs-on: ubuntu-latest
    needs: [lint, build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile benchmarks
        run: |
          cd arlloc-rs
          cargo bench --no-run
