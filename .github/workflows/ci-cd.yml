name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---------------------------------------------------------------------------
  # ЗАДАЧА 1: Статический анализ
  # ---------------------------------------------------------------------------
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run C static analysis
        run: make -C arlloc-rs/c-src cppchk

      - name: Run Rust static analysis
        run: |
          cd arlloc-rs
          cargo fmt --check
          cargo clippy -- -D warnings

  # ---------------------------------------------------------------------------
  # ЗАДАЧА 2: Сборка и тестирование (Ubuntu + macOS)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev check

      - name: Install C dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llvm check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust crate
        run: |
          cd arlloc-rs
          cargo build --release

      - name: Run C tests
        run: make -C arlloc-rs/c-src test

      - name: Run Rust tests
        run: |
          cd arlloc-rs
          cargo test
  # ---------------------------------------------------------------------------
  # ЗАДАЧА 3: Проверка компиляции бенчмарков
  # ---------------------------------------------------------------------------
  bench-compile:
    name: Benchmark Compilation Check
    runs-on: ubuntu-latest
    needs: [lint, build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile benchmarks
        run: |
          cd arlloc-rs
          cargo bench --no-run
  # ---------------------------------------------------------------------------
  # ЗАДАЧА 4: Генерация и деплой документации на GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [lint, build-and-test] # Ждем успешного прохождения тестов
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write # Разрешение на запись в репозиторий (для gh-pages)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate C Documentation
        run: |
          mkdir -p docs/c 
          cd arlloc-rs/c-src
          doxygen -s "OUTPUT_DIRECTORY=$(cd ../.. && pwd)/docs/c" Doxyfile

      - name: Generate Rust Documentation
        run: |
          cd arlloc-rs
          # Генерируем документацию без зависимостей для скорости
          cargo doc --no-deps
          # Копируем результат в общую директорию docs/rust
          mkdir -p ../docs/rust
          cp -r target/doc/* ../docs/rust/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true # Очищает историю ветки gh-pages, оставляя только актуальные файлы
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
