name: CI/CD Pipeline

# Триггеры: запуск при пуше в master, при создании PR в master, и при создании тега версии (v*)
on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---------------------------------------------------------------------------
  # ЗАДАЧА 1: Статический анализ кода (Linting)
  # ---------------------------------------------------------------------------
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run C static analysis
        run: make cppchk

      - name: Run Rust static analysis
        run: |
          cd arlloc-rs
          cargo fmt --check
          cargo clippy -- -D warnings

  # ---------------------------------------------------------------------------
  # ЗАДАЧА 2: Сборка и тестирование (Build & Test)
  # Выполняется матрицей на Ubuntu и macOS для проверки кроссплатформенности
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y lcov clang libclang-dev

      - name: Install C dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install lcov llvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build project
        run: make all

      - name: Run tests
        run: make test

  # ---------------------------------------------------------------------------
  # ЗАДАЧА 3: Развертывание документации (CD)
  # Запускается только при успешном завершении lint и build-and-test в ветке master
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: Deploy Documentation
    needs: [lint, build-and-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate documentation
        run: make docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

  # ---------------------------------------------------------------------------
  # ЗАДАЧА 4: Формирование релизных артефактов (CD)
  # Запускается только при создании тега, начинающегося с 'v' (например, v1.0.0)
  # ---------------------------------------------------------------------------
  create-release:
    name: Create Release Assets
    needs: [lint, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build C library
        run: make build-c

      - name: Package artifacts
        run: |
          mkdir -p release-assets
          cp C-Arena/src/arlloc.h release-assets/
          cp C-Arena/build/libarlloc.a release-assets/
          cp README.md release-assets/
          cd release-assets
          zip -r arlloc-c-linux-x86_64.zip .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/arlloc-c-linux-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
