[package]
name = "arlloc"
version = "0.1.1"
edition = "2024"
description = "High-performance bump allocator with C core and safe Rust wrapper. O(1) allocation without fragmentation, locks, or syscalls in the hot path."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Max-Jenever/arlloc"

[build-dependencies]
cc = "1.0"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
bumpalo = "3.15"
typed-arena = "2.0"

[[bench]]
name = "allocator_bench"
harness = false
